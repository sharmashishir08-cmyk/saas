name: refresh-comps

on:
  schedule:
    - cron: "30 6 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Scrape SEG + rejoin tags
        run: python scripts/scrape_seg.py
      - name: Commit if changed
        run: |
          git config user.name  "comps-bot"
          git config user.email "comps-bot@users.noreply.github.com"
          git add data/companies.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "data: refresh comps $(date -u +%Y-%m-%d)"
            git push
          fi
